name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile scripts
        run: python -m compileall -q scripts

      - name: Validate compat data
        run: python -c "import json; d=json.load(open('data/vita3k-compat.json', encoding='utf-8')); print(len(d['list']), 'entries')"

      - name: CLI smoke tests
        run: |
          python scripts/check-dump.py --help
          python scripts/get-patch.py --help
          python scripts/merge-patch.py --help
          python scripts/psv-lookup.py --help
